apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgr-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bgr-project
  template:
    metadata:
      labels:
        app: bgr-project
    spec:
      containers:
      - name: bgr-project
        image: vipin2310/bgr-python:3.11.15
        securityContext:
          runAsUser: 0
        ports:
          - containerPort: 22
        resources:
          requests:
            # cpu: "10"
            nvidia.com/gpu: 1
          limits:
            # memory: 200Gi
            memory: 250Gi
            nvidia.com/gpu: 1
        volumeMounts:
          - name: bgr-project-pvc
            mountPath: /storage
          - name: ssh-key
            mountPath: /root/.ssh
          - name: dshm
            mountPath: /dev/shm
      nodeSelector:
        # kubernetes.io/hostname: cl-worker24
        gpu: h100
      volumes:
        - name: bgr-project-pvc
          persistentVolumeClaim:
            claimName: bgr-project-pvc
        - name: ssh-key
          secret:
            secretName: ssh-key-secret
        - name: dshm
          emptyDir:
            medium: Memory